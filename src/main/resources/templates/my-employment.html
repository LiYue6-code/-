<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>就业上报 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="page-header">
        <h1>就业信息上报</h1>
        <div class="ops">
            <a class="btn btn-gray btn-sm" th:href="@{/my/progress}">处理进度</a>
            <a class="btn btn-gray btn-sm" th:href="@{/jobs}">岗位列表</a>
        </div>
    </div>

    <div th:if="${msg}" class="success" th:text="${msg}"></div>
    <div th:if="${err}" class="error" th:text="${err}"></div>

    <!-- 上报表单：没有在途记录、也没有待补正记录时才允许新建上报 -->
    <div class="card" th:if="${canReport}">
        <h2>上报就业信息</h2>
        <form th:action="@{/my/employment}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-group">
                <label>就业单位 <span class="required">*</span></label>
                <input type="text" name="companyName" required maxlength="100" placeholder="如：某信息技术有限公司">
            </div>
            <div class="form-group">
                <label>岗位</label>
                <input type="text" name="position" maxlength="100" placeholder="如：Java 开发工程师">
            </div>
            <div class="form-group">
                <label>薪资待遇</label>
                <input type="text" name="salary" maxlength="50" placeholder="如：8000-12000">
            </div>
            <div class="form-group">
                <label>证明材料</label>
                <input type="file" name="proofFile" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                <span class="muted">支持 PDF/图片/Word，不超过 5MB，如录用函、三方协议</span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">提交</button>
            </div>
        </form>
    </div>
    <div class="card" th:if="${!canReport and returned == null}">
        <span class="badge badge-warn">处理中</span>
        <span class="muted" style="margin-left:8px;">
            你已有一条待审核或已确认的就业信息，无需重复上报。可以到
            <a th:href="@{/my/progress}">处理进度</a> 查看审核情况。
        </span>
    </div>

    <!-- 被退回后：修改并重新上报 -->
    <div class="card" th:if="${returned != null}">
        <h2>补正后重新上报</h2>
        <p class="error" th:if="${returned.reviewComment != null}"
           th:text="|退回意见：${returned.reviewComment}|"></p>
        <form th:action="@{/my/employment/{id}/resubmit(id=${returned.id})}" method="post"
              enctype="multipart/form-data">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-group">
                <label>就业单位 <span class="required">*</span></label>
                <input type="text" name="companyName" required maxlength="100" th:value="${returned.companyName}">
            </div>
            <div class="form-group">
                <label>岗位</label>
                <input type="text" name="position" maxlength="100" th:value="${returned.position}">
            </div>
            <div class="form-group">
                <label>薪资待遇</label>
                <input type="text" name="salary" maxlength="50" th:value="${returned.salary}">
            </div>
            <div class="form-group">
                <label>重新上传证明</label>
                <input type="file" name="proofFile" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                <span class="muted">不选择则沿用原证明材料</span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">重新提交</button>
            </div>
        </form>
    </div>

    <h2>上报记录</h2>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>就业单位</th>
                <th>岗位</th>
                <th>薪资</th>
                <th>证明材料</th>
                <th>状态</th>
                <th>审核意见</th>
                <th>上报时间</th>
                <th>重报次数</th>
                <th>进度</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${list}">
                <td th:text="${e.companyName}"></td>
                <td th:text="${e.position}"></td>
                <td th:text="${e.salary}"></td>
                <td>
                    <a th:if="${e.proofFile != null}"
                       th:href="@{/my/employment/{id}/proof(id=${e.id})}"
                       th:text="${e.proofName == null ? '查看材料' : e.proofName}"></a>
                    <span th:if="${e.proofFile == null}" class="muted">未上传</span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${e.status == '待审核' ? 'badge-warn' : (e.status == '已确认' ? 'badge-success' : 'badge-danger')}"
                          th:text="${e.status}"></span>
                </td>
                <td th:text="${e.reviewComment}"></td>
                <td th:text="${e.submitTime == null ? '' : #temporals.format(e.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${e.resubmitCount == null ? 0 : e.resubmitCount}"></td>
                <td class="ops">
                    <a class="btn btn-gray btn-sm" th:href="@{/my/employment/{id}/progress(id=${e.id})}">查看进度</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(list)}">
                <td colspan="9" style="text-align:center;">暂无上报记录</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
