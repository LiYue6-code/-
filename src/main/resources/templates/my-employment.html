<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>就业上报 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1>就业信息上报</h1>
    <div class="card">
        <form th:action="@{/my/employment}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-group">
                <label>就业单位</label>
                <input type="text" name="companyName" required>
            </div>
            <div class="form-group">
                <label>岗位</label>
                <input type="text" name="position">
            </div>
            <div class="form-group">
                <label>薪资待遇</label>
                <input type="text" name="salary">
            </div>
            <div class="form-group">
                <label>证明材料</label>
                <input type="file" name="proofFile">
            </div>
            <button type="submit" class="btn">提交</button>
        </form>
    </div>

    <h2>上报记录</h2>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>就业单位</th>
                <th>岗位</th>
                <th>薪资</th>
                <th>证明材料</th>
                <th>状态</th>
                <th>审核意见</th>
                <th>上报时间</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${list}">
                <td th:text="${e.companyName}"></td>
                <td th:text="${e.position}"></td>
                <td th:text="${e.salary}"></td>
                <td th:text="${e.proofFile}"></td>
                <td th:text="${e.status}"></td>
                <td th:text="${e.reviewComment}"></td>
                <td th:text="${#temporals.format(e.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(list)}">
                <td colspan="7" style="text-align:center;">暂无上报记录</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
