<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${job.id == null} ? '发布岗位 - 就业管理系统' : '编辑岗位 - 就业管理系统'">岗位 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${job.id == null} ? '发布岗位' : '编辑岗位'">发布岗位</h1>
        <a class="btn btn-gray btn-sm" th:href="@{/admin/jobs}">返回列表</a>
    </div>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div class="card">
        <form th:action="${job.id == null} ? @{/admin/jobs} : @{/admin/jobs/{id}/update(id=${job.id})}"
              method="post" th:object="${job}">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-group">
                <label>招聘单位</label>
                <select th:field="*{companyId}" required>
                    <option value="">请选择招聘单位</option>
                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>岗位名称</label>
                <input type="text" th:field="*{title}" maxlength="100" required>
            </div>
            <div class="form-group">
                <label>薪资待遇</label>
                <input type="text" th:field="*{salary}" maxlength="50">
            </div>
            <div class="form-group">
                <label>招聘人数</label>
                <input type="number" th:field="*{headcount}" min="1" max="9999">
            </div>
            <div class="form-group">
                <label>任职要求</label>
                <textarea th:field="*{requirement}" maxlength="500" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>岗位描述</label>
                <textarea th:field="*{description}" rows="6"></textarea>
            </div>
            <div class="form-group">
                <label>岗位状态</label>
                <select th:field="*{status}">
                    <option value="招聘中">招聘中</option>
                    <option value="已截止">已截止</option>
                </select>
            </div>
            <button type="submit" class="btn" th:text="${job.id == null} ? '发布' : '保存'">发布</button>
        </form>
    </div>
</div>
</body>
</html>
