<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布岗位 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1>发布岗位</h1>
    <div class="card">
        <form th:action="@{/admin/jobs}" method="post" th:object="${job}">
            <div class="form-group">
                <label>招聘单位</label>
                <select th:field="*{companyId}">
                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>岗位名称</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="form-group">
                <label>薪资待遇</label>
                <input type="text" th:field="*{salary}">
            </div>
            <div class="form-group">
                <label>招聘人数</label>
                <input type="number" th:field="*{headcount}">
            </div>
            <div class="form-group">
                <label>任职要求</label>
                <textarea th:field="*{requirement}"></textarea>
            </div>
            <div class="form-group">
                <label>岗位描述</label>
                <textarea th:field="*{description}"></textarea>
            </div>
            <button type="submit" class="btn">发布</button>
        </form>
    </div>
</div>
</body>
</html>
