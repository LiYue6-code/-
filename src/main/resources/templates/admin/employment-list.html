<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>就业审核 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="page-header">
        <h1>就业信息审核</h1>
        <div class="ops">
            <a class="btn btn-gray btn-sm"
               th:href="@{/admin/employment/export(keyword=${keyword},status=${status},from=${from},to=${to})}">导出 CSV</a>
        </div>
    </div>

    <div th:if="${msg}" class="success" th:text="${msg}"></div>
    <div th:if="${err}" class="error" th:text="${err}"></div>

    <form class="card toolbar" method="get" th:action="@{/admin/employment}">
        <input type="text" name="keyword" placeholder="学生姓名 / 学号 / 就业单位 / 岗位"
               th:value="${keyword}">
        <select name="status">
            <option value="" th:selected="${status == null or status == ''}">全部状态</option>
            <option value="待审核" th:selected="${status == '待审核'}">待审核</option>
            <option value="已确认" th:selected="${status == '已确认'}">已确认</option>
            <option value="已退回" th:selected="${status == '已退回'}">已退回</option>
        </select>
        <label class="muted">上报时间</label>
        <input type="date" name="from" th:value="${from}">
        <span class="muted">至</span>
        <input type="date" name="to" th:value="${to}">
        <button type="submit" class="btn">查询</button>
        <a class="btn btn-gray" th:href="@{/admin/employment}">重置</a>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>学生</th>
                <th>学号</th>
                <th>就业单位</th>
                <th>岗位</th>
                <th>薪资</th>
                <th>证明材料</th>
                <th>状态</th>
                <th>上报时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${pageData.items}">
                <td th:text="${e.studentName}"></td>
                <td th:text="${e.studentNo}"></td>
                <td th:text="${e.companyName}"></td>
                <td th:text="${e.position}"></td>
                <td th:text="${e.salary}"></td>
                <td>
                    <a th:if="${e.proofFile != null}"
                       th:href="@{/admin/employment/{id}/proof(id=${e.id})}"
                       th:text="${e.proofName == null ? '下载证明材料' : e.proofName}"></a>
                    <span th:if="${e.proofFile == null}" class="muted">未上传</span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${e.status == '待审核' ? 'badge-warn' : (e.status == '已确认' ? 'badge-success' : 'badge-danger')}"
                          th:text="${e.status}"></span>
                </td>
                <td th:text="${e.submitTime == null ? '' : #temporals.format(e.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="ops">
                    <a class="btn btn-sm" th:href="@{/admin/employment/{id}(id=${e.id})}">审核</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pageData.items)}">
                <td colspan="9" style="text-align:center;">没有符合条件的上报记录</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${pageData.totalPages > 1}">
            <a th:if="${pageData.hasPrev}"
               th:href="@{/admin/employment(page=${pageData.page - 1},keyword=${keyword},status=${status},from=${from},to=${to})}">上一页</a>
            <a th:each="p : ${pageData.pageNumbers}"
               th:classappend="${p == pageData.page ? 'current' : ''}"
               th:href="@{/admin/employment(page=${p},keyword=${keyword},status=${status},from=${from},to=${to})}"
               th:text="${p}"></a>
            <a th:if="${pageData.hasNext}"
               th:href="@{/admin/employment(page=${pageData.page + 1},keyword=${keyword},status=${status},from=${from},to=${to})}">下一页</a>
        </div>
        <div class="muted" style="margin-top:8px;"
             th:text="|共 ${pageData.total} 条，第 ${pageData.page} / ${pageData.totalPages} 页|"></div>
    </div>
</div>
</body>
</html>
