<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>单位管理 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1>招聘单位管理</h1>

    <div th:if="${err}" class="error" th:text="${err}"></div>
    <div th:if="${msg}" class="success" th:text="${msg}"></div>

    <form class="card toolbar" method="get" th:action="@{/admin/companies}">
        <input type="text" name="keyword" placeholder="单位名称 / 联系人 / 电话" th:value="${keyword}" style="min-width:240px;">
        <button type="submit" class="btn">查询</button>
        <a class="btn btn-gray" th:href="@{/admin/companies}">重置</a>
        <a class="btn" th:href="@{/admin/companies/new}">新增单位</a>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>性质</th>
                <th>联系人</th>
                <th>电话</th>
                <th>地址</th>
                <th>岗位数</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${pageData.items}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.type == null ? '—' : c.type}"></td>
                <td th:text="${c.contact == null ? '—' : c.contact}"></td>
                <td th:text="${c.phone == null ? '—' : c.phone}"></td>
                <td th:text="${c.address == null ? '—' : c.address}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${c.jobCount != null and c.jobCount > 0} ? 'badge-gray' : 'badge-success'"
                          th:text="${c.jobCount == null ? 0 : c.jobCount}"></span>
                </td>
                <td>
                    <a class="btn btn-sm" th:href="@{/admin/companies/{id}/edit(id=${c.id})}">编辑</a>
                    <form th:action="@{/admin/companies/{id}/delete(id=${c.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="_csrf" th:value="${_csrf}">
                        <button type="submit" class="btn btn-sm btn-red"
                                onclick="return confirm('确认删除该单位？如果该单位下还有岗位，系统会拒绝删除。')">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pageData.items)}">
                <td colspan="8" style="text-align:center;">没有符合条件的单位</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${pageData.totalPages > 1}">
            <a th:if="${pageData.hasPrev}"
               th:href="@{/admin/companies(page=${pageData.page - 1},keyword=${keyword})}">上一页</a>
            <a th:each="p : ${pageData.pageNumbers}"
               th:classappend="${p == pageData.page ? 'current' : ''}"
               th:href="@{/admin/companies(page=${p},keyword=${keyword})}"
               th:text="${p}"></a>
            <a th:if="${pageData.hasNext}"
               th:href="@{/admin/companies(page=${pageData.page + 1},keyword=${keyword})}">下一页</a>
        </div>
        <div class="muted" style="margin-top:8px;"
             th:text="|共 ${pageData.total} 个单位，第 ${pageData.page} / ${pageData.totalPages} 页|"></div>
    </div>
</div>
</body>
</html>
