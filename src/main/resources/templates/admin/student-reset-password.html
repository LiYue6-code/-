<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>重置密码 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1>重置学生密码</h1>
    <div class="card" style="max-width:480px;">
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p>为学生 <strong th:text="${student.name}"></strong>（学号 <strong th:text="${student.studentNo}"></strong>）设置新密码：</p>
        <form th:action="@{/admin/students/{id}/reset-password(id=${student.id})}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">重置密码</button>
            <a class="btn btn-gray" th:href="@{/admin/students}">取消</a>
        </form>
    </div>
</div>
</body>
</html>
