<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>岗位管理 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1>岗位管理</h1>

    <div th:if="${err}" class="error" th:text="${err}"></div>
    <div th:if="${msg}" class="success" th:text="${msg}"></div>

    <form class="card toolbar" method="get" th:action="@{/admin/jobs}">
        <input type="text" name="keyword" placeholder="岗位名称 / 招聘单位" th:value="${keyword}" style="min-width:220px;">
        <select name="companyId">
            <option value="">全部招聘单位</option>
            <option th:each="c : ${companies}" th:value="${c.id}"
                    th:selected="${companyId != null and companyId == c.id}"
                    th:text="${c.name}"></option>
        </select>
        <select name="status">
            <option value="">全部状态</option>
            <option value="招聘中" th:selected="${status == '招聘中'}">招聘中</option>
            <option value="已截止" th:selected="${status == '已截止'}">已截止</option>
        </select>
        <button type="submit" class="btn">查询</button>
        <a class="btn btn-gray" th:href="@{/admin/jobs}">重置</a>
        <a class="btn" th:href="@{/admin/jobs/new}">发布岗位</a>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>岗位</th>
                <th>招聘单位</th>
                <th>薪资</th>
                <th>人数</th>
                <th>状态</th>
                <th>发布时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="j : ${pageData.items}">
                <td th:text="${j.id}"></td>
                <td th:text="${j.title}"></td>
                <td th:text="${j.companyName == null ? '（单位已删除）' : j.companyName}"></td>
                <td th:text="${j.salary == null ? '—' : j.salary}"></td>
                <td th:text="${j.headcount == null ? '—' : j.headcount}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${j.open} ? 'badge-success' : 'badge-gray'"
                          th:text="${j.status}"></span>
                </td>
                <td th:text="${j.publishTime == null ? '—' : #temporals.format(j.publishTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <a class="btn btn-sm" th:href="@{/admin/jobs/{id}/edit(id=${j.id})}">编辑</a>
                    <form th:if="${j.status == '招聘中'}" th:action="@{/admin/jobs/{id}/offline(id=${j.id})}"
                          method="post" style="display:inline;">
                        <input type="hidden" name="_csrf" th:value="${_csrf}">
                        <button type="submit" class="btn btn-sm btn-gray">下架</button>
                    </form>
                    <form th:if="${j.status == '已截止'}" th:action="@{/admin/jobs/{id}/online(id=${j.id})}"
                          method="post" style="display:inline;">
                        <input type="hidden" name="_csrf" th:value="${_csrf}">
                        <button type="submit" class="btn btn-sm btn-green">上架</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pageData.items)}">
                <td colspan="8" style="text-align:center;">没有符合条件的岗位</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${pageData.totalPages > 1}">
            <a th:if="${pageData.hasPrev}"
               th:href="@{/admin/jobs(page=${pageData.page - 1},keyword=${keyword},companyId=${companyId},status=${status})}">上一页</a>
            <a th:each="p : ${pageData.pageNumbers}"
               th:classappend="${p == pageData.page ? 'current' : ''}"
               th:href="@{/admin/jobs(page=${p},keyword=${keyword},companyId=${companyId},status=${status})}"
               th:text="${p}"></a>
            <a th:if="${pageData.hasNext}"
               th:href="@{/admin/jobs(page=${pageData.page + 1},keyword=${keyword},companyId=${companyId},status=${status})}">下一页</a>
        </div>
        <div class="muted" style="margin-top:8px;"
             th:text="|共 ${pageData.total} 个岗位，第 ${pageData.page} / ${pageData.totalPages} 页|"></div>
    </div>
</div>
</body>
</html>
