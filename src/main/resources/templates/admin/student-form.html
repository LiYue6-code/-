<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生表单 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1 th:text="${student.id == null} ? '新增学生' : '编辑学生'">学生表单</h1>
    <div class="card">
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <form th:action="${student.id == null} ? @{/admin/students} : @{/admin/students/{id}/update(id=${student.id})}"
              method="post" th:object="${student}">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-row">
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" th:field="*{studentNo}" th:readonly="${student.id != null}" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" th:field="*{name}" required>
                </div>
            </div>
            <div class="form-row" th:if="${student.id == null}">
                <div class="form-group">
                    <label>初始密码</label>
                    <input type="password" name="password" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>专业</label>
                    <input type="text" th:field="*{major}">
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="text" th:field="*{phone}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" th:field="*{email}">
                </div>
                <div class="form-group" th:if="${student.id != null}">
                    <label>状态</label>
                    <select name="status">
                        <option value="正常" th:selected="${student.status == '正常'}">正常</option>
                        <option value="禁用" th:selected="${student.status == '禁用'}">禁用</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">保存</button>
                <a class="btn btn-gray" th:href="@{/admin/students}">取消</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
