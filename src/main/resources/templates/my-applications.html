<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的申请 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1>我的申请</h1>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>岗位</th>
                <th>招聘单位</th>
                <th>申请时间</th>
                <th>审核状态</th>
                <th>面试结果</th>
                <th>录用状态</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${applications}">
                <td th:text="${a.jobTitle}"></td>
                <td th:text="${a.companyName}"></td>
                <td th:text="${#temporals.format(a.applyTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${a.status}"></td>
                <td th:text="${a.interviewResult}"></td>
                <td th:text="${a.hireStatus}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(applications)}">
                <td colspan="6" style="text-align:center;">暂无申请记录</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
