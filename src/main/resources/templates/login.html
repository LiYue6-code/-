<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-page">
    <!-- 背景装饰光斑 -->
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-3" aria-hidden="true"></div>

    <div class="login-card">
        <!-- 品牌区 -->
        <div class="brand">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1>就业管理系统</h1>
            <p>Employment Management System</p>
        </div>

        <!-- 提示信息 -->
        <div th:if="${error}" class="alert alert-error" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${param.registered}" class="alert alert-success" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span>注册成功，请登录</span>
        </div>

        <form th:action="@{/login}" method="post" autocomplete="off">
            <input type="hidden" name="_csrf" th:value="${_csrf}">

            <!-- 身份切换 -->
            <div class="role-switch" role="radiogroup" aria-label="选择登录身份">
                <input type="radio" name="role" id="role-student" value="student" checked>
                <label for="role-student">学生</label>
                <input type="radio" name="role" id="role-admin" value="admin">
                <label for="role-admin">学校负责人</label>
                <span class="role-slider" aria-hidden="true"></span>
            </div>

            <!-- 账号 -->
            <div class="field">
                <span class="field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </span>
                <input type="text" name="username" id="username" placeholder=" " required autofocus>
                <label for="username">账号 / 学号</label>
            </div>

            <!-- 密码 -->
            <div class="field field-password">
                <span class="field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <input type="password" name="password" id="password" placeholder=" " required>
                <label for="password">密码</label>
                <button type="button" class="toggle-pwd" id="togglePwd" aria-label="显示密码">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn-login">
                <span>登 录</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>

        <!-- 注册入口 -->
        <p class="footer-link">还没有账号？<a th:href="@{/register}">学生注册</a></p>
    </div>
</div>

<script>
    // 密码显示/隐藏切换
    (function () {
        var toggle = document.getElementById('togglePwd');
        var pwd = document.getElementById('password');
        if (!toggle || !pwd) return;
        toggle.addEventListener('click', function () {
            var show = pwd.type === 'password';
            pwd.type = show ? 'text' : 'password';
            toggle.classList.toggle('show', show);
            toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        });
    })();
</script>
</body>
</html>
