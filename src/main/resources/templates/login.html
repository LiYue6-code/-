<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width:420px;">
    <div class="card">
        <h2 style="text-align:center;">就业管理系统</h2>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p th:if="${param.registered}" class="success">注册成功，请登录</p>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>账号</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>身份</label>
                <select name="role">
                    <option value="student">学生</option>
                    <option value="admin">学校负责人</option>
                </select>
            </div>
            <button type="submit" class="btn" style="width:100%;">登录</button>
        </form>
        <p style="margin-top:12px;font-size:14px;">
            <a th:href="@{/register}">学生注册</a>
        </p>
    </div>
</div>
</body>
</html>
