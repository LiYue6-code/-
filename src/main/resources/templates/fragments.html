<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 顶部导航栏片段 -->
<nav th:fragment="nav" class="nav">
    <span class="brand">就业管理系统</span>
    <div>
        <span class="user" th:text="'当前用户：' + ${session.userName} + '（' + (${session.userType} == 'admin' ? '学校负责人' : '学生') + '）'"></span>
        <span th:if="${session.userType == 'student'}">
            <a th:href="@{/jobs}">岗位列表</a>

        </span>
        <span th:if="${session.userType == 'admin'}">

            <a th:href="@{/admin/companies}">单位管理</a>
            <a th:href="@{/admin/jobs}">岗位管理</a>
            <a th:href="@{/admin/applications}">申请审核</a>
            <a th:href="@{/admin/employment}">就业审核</a>
        </span>
        <a th:href="@{/logout}">退出</a>
    </div>
</nav>
</body>
</html>
