<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>岗位列表 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="page-header">
        <h1>招聘岗位</h1>
        <div class="ops">
            <a class="btn btn-gray btn-sm" th:href="@{/my/progress}">处理进度</a>
            <a class="btn btn-gray btn-sm" th:href="@{/my/applications}">我的申请</a>
        </div>
    </div>

    <div th:if="${msg}" class="success" th:text="${msg}"></div>
    <div th:if="${err}" class="error" th:text="${err}"></div>

    <form class="card toolbar" method="get" th:action="@{/jobs}">
        <input type="text" name="keyword" placeholder="岗位名称 / 招聘单位" th:value="${keyword}" style="min-width:240px;">
        <select name="companyId">
            <option value="">全部招聘单位</option>
            <option th:each="c : ${companies}" th:value="${c.id}"
                    th:selected="${companyId != null and companyId == c.id}"
                    th:text="${c.name}"></option>
        </select>
        <button type="submit" class="btn">查询</button>
        <a class="btn btn-gray" th:href="@{/jobs}">重置</a>
    </form>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>岗位名称</th>
                <th>招聘单位</th>
                <th>薪资待遇</th>
                <th>招聘人数</th>
                <th>发布时间</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${pageData.items}">
                <td>
                    <a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}"></a>
                    <span class="badge badge-success" th:if="${appliedJobIds.contains(job.id)}"
                          style="margin-left:6px;">已申请</span>
                </td>
                <td th:text="${job.companyName}"></td>
                <td th:text="${job.salary}"></td>
                <td th:text="${job.headcount}"></td>
                <td th:text="${job.publishTime == null ? '' : #temporals.format(job.publishTime, 'yyyy-MM-dd')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${job.status == '招聘中' ? 'badge-success' : 'badge-gray'}"
                          th:text="${job.status}"></span>
                </td>
                <td class="ops">
                    <a class="btn btn-sm" th:href="@{/jobs/{id}(id=${job.id})}">查看详情</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pageData.items)}">
                <td colspan="7" style="text-align:center;">没有符合条件的岗位</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${pageData.totalPages > 1}">
            <a th:if="${pageData.hasPrev}"
               th:href="@{/jobs(page=${pageData.page - 1},keyword=${keyword},companyId=${companyId})}">上一页</a>
            <a th:each="p : ${pageData.pageNumbers}"
               th:classappend="${p == pageData.page ? 'current' : ''}"
               th:href="@{/jobs(page=${p},keyword=${keyword},companyId=${companyId})}"
               th:text="${p}"></a>
            <a th:if="${pageData.hasNext}"
               th:href="@{/jobs(page=${pageData.page + 1},keyword=${keyword},companyId=${companyId})}">下一页</a>
        </div>
        <div class="muted" style="margin-top:8px;"
             th:text="|共 ${pageData.total} 个岗位，第 ${pageData.page} / ${pageData.totalPages} 页|"></div>
    </div>
</div>
</body>
</html>
