<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑简历 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <h1 th:text="${resume.id == null} ? '新增简历' : '编辑简历'"></h1>
    <div th:if="${err}" class="error" th:text="${err}"></div>
    <div class="card">
        <form th:action="${resume.id == null} ? @{/my/resume} : @{/my/resume/{id}/update(id=${resume.id})}"
              method="post" th:object="${resume}">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-row">
                <div class="form-group">
                    <label>简历标题</label>
                    <input type="text" th:field="*{title}" placeholder="如：Java 开发工程师-默认简历" required>
                </div>
                <div class="form-group">
                    <label>学历</label>
                    <select th:field="*{education}">
                        <option value="">请选择</option>
                        <option value="本科">本科</option>
                        <option value="硕士">硕士</option>
                        <option value="博士">博士</option>
                        <option value="大专">大专</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>毕业院校</label>
                    <input type="text" th:field="*{school}">
                </div>
                <div class="form-group">
                    <label>专业</label>
                    <input type="text" th:field="*{major}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>毕业年份</label>
                    <input type="text" th:field="*{graduateYear}" placeholder="如：2026">
                </div>
                <div class="form-group">
                    <label>技能标签</label>
                    <input type="text" th:field="*{skills}" placeholder="如：Java,Spring Boot,MySQL">
                </div>
            </div>
            <div class="form-group">
                <label>实习/项目经历</label>
                <textarea th:field="*{experience}" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>自我评价</label>
                <textarea th:field="*{selfEval}" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>设为默认简历</label>
                <input type="checkbox" th:field="*{defaultFlag}">
            </div>
            <button type="submit" class="btn">保存</button>
            <a class="btn btn-gray" th:href="@{/my/resume}">返回</a>
        </form>
    </div>
</div>
</body>
</html>
