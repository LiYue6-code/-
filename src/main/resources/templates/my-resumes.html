<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的简历 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="page-header">
        <h1>我的简历</h1>
        <a class="btn btn-sm" th:href="@{/my/resume/new}">新增简历</a>
    </div>
    <div th:if="${msg}" class="success" th:text="${msg}"></div>
    <div th:if="${err}" class="error" th:text="${err}"></div>

    <div class="card">
        <h2>求职意向</h2>
        <form th:action="@{/my/intention}" method="post" th:object="${intention}">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-row">
                <div class="form-group">
                    <label>意向行业</label>
                    <input type="text" th:field="*{industry}" placeholder="如：软件与信息技术服务">
                </div>
                <div class="form-group">
                    <label>意向岗位</label>
                    <input type="text" th:field="*{position}" placeholder="如：Java 开发工程师">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>意向城市</label>
                    <input type="text" th:field="*{city}" placeholder="如：北京">
                </div>
                <div class="form-group">
                    <label>期望薪资</label>
                    <input type="text" th:field="*{salary}" placeholder="如：8000-12000">
                </div>
            </div>
            <button type="submit" class="btn">保存求职意向</button>
        </form>
    </div>

    <div class="card">
        <h2>简历列表</h2>
        <table>
            <thead>
            <tr>
                <th>简历标题</th>
                <th>学历</th>
                <th>毕业院校</th>
                <th>专业</th>
                <th>更新时间</th>
                <th>默认</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${resumes}">
                <td th:text="${r.title}"></td>
                <td th:text="${r.education}"></td>
                <td th:text="${r.school}"></td>
                <td th:text="${r.major}"></td>
                <td th:text="${r.updateTime == null ? '' : #temporals.format(r.updateTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${r.defaultFlag ? '是' : '否'}"></td>
                <td class="ops">
                    <a class="btn btn-sm" th:href="@{/my/resume/{id}/edit(id=${r.id})}">编辑</a>
                    <form th:if="${!r.defaultFlag}" th:action="@{/my/resume/{id}/default(id=${r.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="_csrf" th:value="${_csrf}">
                        <button type="submit" class="btn btn-green btn-sm">设为默认</button>
                    </form>
                    <form th:action="@{/my/resume/{id}/delete(id=${r.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="_csrf" th:value="${_csrf}">
                        <button type="submit" class="btn btn-red btn-sm" onclick="return confirm('确认删除该简历？')">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(resumes)}">
                <td colspan="7" style="text-align:center;">暂无简历，请点击「新增简历」创建</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
