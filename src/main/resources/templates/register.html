<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width:460px;">
    <div class="card">
        <h2 style="text-align:center;">学生注册</h2>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <form th:action="@{/register}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf}">
            <div class="form-group">
                <label>学号</label>
                <input type="text" name="studentNo" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>专业</label>
                <input type="text" name="major">
            </div>
            <div class="form-group">
                <label>联系电话</label>
                <input type="text" name="phone">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="text" name="email">
            </div>
            <button type="submit" class="btn" style="width:100%;">注册</button>
        </form>
        <p style="margin-top:12px;font-size:14px;"><a th:href="@{/login}">返回登录</a></p>
    </div>
</div>
</body>
</html>
