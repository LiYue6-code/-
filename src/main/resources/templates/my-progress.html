<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>处理进度 - 就业管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
    <div class="page-header">
        <h1 th:text="${title}">处理进度</h1>
        <div class="ops">
            <a class="btn btn-gray btn-sm" th:href="@{/my/progress}">返回处理进度</a>
            <a class="btn btn-gray btn-sm" href="javascript:history.back()">返回上一页</a>
        </div>
    </div>

    <div class="card">
        <div class="kv">
            <div><span>事项</span><b th:text="${subject}"></b></div>
            <div><span>当前状态</span><b th:text="${current}"></b></div>
            <div><span>处理节点</span><b th:text="|${#lists.size(logs)} 条|"></b></div>
        </div>
    </div>

    <div class="card">
        <h2>处理时间线</h2>
        <ul class="timeline">
            <li th:each="log : ${logs}">
                <div class="tl-time"
                     th:text="${log.createdAt == null ? '' : #temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                <div class="tl-body">
                    <span class="tl-action" th:text="${log.actionLabel}"></span>
                    <div class="tl-meta" th:text="|处理人：${log.operatorName == null ? '系统' : log.operatorName}|"></div>
                    <div class="tl-meta" th:if="${log.fromStatus != null and log.toStatus != null}"
                         th:text="|状态：${log.fromStatus} → ${log.toStatus}|"></div>
                    <div class="tl-comment" th:if="${log.comment != null}" th:text="${log.comment}"></div>
                </div>
            </li>
        </ul>
        <div th:if="${#lists.isEmpty(logs)}" class="muted">暂无处理记录</div>
    </div>
</div>
</body>
</html>
