server:
  port: 8080
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: employment-system
  datasource:
    # 请按本机 MySQL 修改 username / password；数据库名 employment_db
    url: jdbc:mysql://localhost:3306/employment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# 证明材料保存目录（相对运行目录，可改为绝对路径）
app:
  upload-dir: uploads

mybatis:
  # 复杂查询（条件分页、统计聚合）写在 XML 中，必须显式声明 mapper 位置
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.employment: debug
